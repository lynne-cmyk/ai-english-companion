appId: com.lynne.aienglishcompanion
productName: Tirva
asar: true

directories:
  output: release

files:
  - dist/index.html
  - dist/api-key-setup.html
  - dist/permission-setup.html
  - dist/popover-window.html
  - dist/selection-action.html
  - dist/assets/**/*
  - dist-electron/main.js
  - dist-electron/aiRecovery.js
  - dist-electron/explanation/**/*
  - dist-electron/loginItems/loginItemService.js
  - dist-electron/nativeHelperPaths.js
  - dist-electron/permissions/contracts.js
  - dist-electron/permissions/menuBarIcon.js
  - dist-electron/permissions/menuBarIconData.js
  - dist-electron/permissions/permissionState.js
  - dist-electron/permissions/permissionSetupWindow.js
  - dist-electron/permissions/preload.js
  - dist-electron/permissions/setupPresentation.js
  - dist-electron/popoverIpc.js
  - dist-electron/preload.js
  - dist-electron/selection/**/*
  - dist-electron/secrets/apiKeySetupWindow.js
  - dist-electron/secrets/contracts.js
  - dist-electron/secrets/preload.js
  - dist-electron/secrets/safeStorageCipher.js
  - dist-electron/secrets/secretStore.js
  - dist-provider/deepSeekProvider.js
  - dist-provider/provider.js
  - dist-provider/types.js
  - package.json
  - "!node_modules/**/*"
  - "!**/*.test.js"
  - "!**/*.map"

extraResources:
  - from: dist-native/frontmost-app
    to: native/frontmost-app
  - from: dist-native/global-mouse-monitor
    to: native/global-mouse-monitor
  - from: dist-native/selection-probe
    to: native/selection-probe

mac:
  icon: assets/brand/generated/app-icon.icns
  target:
    - target: dir
      arch:
        - arm64
